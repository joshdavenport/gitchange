[package]
name = "gitchange-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Test-only: never published, never a production dependency. ADR 0006
# scopes the git2 wall to the production graph, which is why this second
# git2 `Cargo.toml` is not a breach of it.
publish = false

[dependencies]
git2.workspace = true
tempfile.workspace = true
