[package]
name = "gitchange-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The only git2 edge in the *production* dependency graph (ADR 0006, as
# amended): frontends reach git solely through this crate's interface.
# The test-only `gitchange-test-support` carries git2 too — a
# dev-dependency everywhere, which the wall is scoped to exclude.
git2.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Liveness of a lockfile's recorded PID is the one question std cannot
# answer, and its answer is one syscall per platform: `kill(pid, 0)` and
# `OpenProcess`.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
gitchange-test-support.workspace = true
tempfile.workspace = true
