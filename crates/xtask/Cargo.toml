[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gitchange-core = { workspace = true }
# For `HOST_ISOLATION_KNOBS` only — the sandbox builder pins the same git
# config as the test fixture and must not drift from it. Both crates are
# `publish = false`, so this edge stays out of the production graph.
gitchange-test-support = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Peak-RSS probe for the benchmark harness's huge-file memory cases.
libc = "0.2"
