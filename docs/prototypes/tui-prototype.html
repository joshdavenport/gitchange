<!doctype html>
<!--
  PROTOTYPE — throwaway. Lazygit-style panel-stack layout (round-1 winner) for a
  changelist manager. ?variant=A|B|C|D cycles the layout's key STATES:
  A drilled into a changelist, B the "all" meta-view with per-hunk changelist
  tags, C unassigned selected with the move-to-changelist popup open.
  Round-1 layout alternatives live in the first git commit.

  Round 3 (ticket #18): Log panel per ADR 0007 — the tinted-pin-banner
  treatment won. The Log panel [5] now renders in every state (at-rest
  stream, ~20% of the right column); ?variant=E is the busy rebase state
  (pin banner grows the panel, conflicts group, all three severities).
  Losing treatments (inline pins + rule, separate Conditions panel) live
  in git history.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitchange — TUI prototype</title>
<style>
  :root {
    --bg: #1b1d1e;
    --panel-bg: #1b1d1e;
    --fg: #d5c4a1;
    --dim: #665c54;
    --border: #504945;
    --border-focus: #7fbf5e;
    --title: #7daea3;
    --green: #a9b665;
    --yellow: #d8a657;
    --red: #ea6962;
    --blue: #7daea3;
    --magenta: #d3869b;
    --orange: #e78a4e;
    --sel-bg: #32302f;
    --active-bg: #2a3225;
    --add: #a9b665;
    --del: #ea6962;
    --hunk: #7daea3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.45;
    overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; padding: 8px 6px 0; }
  .variant-root { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ── panels ─────────────────────────────────────────── */
  .panel {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 8px 6px;
    margin: 6px 4px 4px;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .panel.focused { border-color: var(--border-focus); }
  .panel > .ptitle {
    position: absolute;
    top: -9px; left: 8px;
    background: var(--bg);
    padding: 0 5px;
    color: var(--title);
    white-space: nowrap;
  }
  .panel.focused > .ptitle { color: var(--border-focus); }
  .panel > .ptitle .pnum { color: var(--dim); }
  .panel > .ptitle .alt { color: var(--dim); }
  .panel > .pcount {
    position: absolute;
    bottom: -1px; right: 10px;
    background: var(--bg);
    padding: 0 5px;
    color: var(--dim);
    font-size: 12px;
    line-height: 1;
  }
  .pbody { overflow-y: auto; flex: 1; min-height: 0; padding-top: 3px; }
  .pbody::-webkit-scrollbar { width: 0; }

  /* ── rows ───────────────────────────────────────────── */
  .row { white-space: pre; padding: 0 4px; cursor: default; }
  .row.sel { background: var(--sel-bg); }
  .row.activebg { background: var(--active-bg); }
  .row .st-m { color: var(--yellow); }
  .row .st-a { color: var(--green); }
  .row .st-d { color: var(--red); }
  .row .st-r { color: var(--blue); }
  .row .staged { color: var(--green); }
  .row .dim { color: var(--dim); }
  .row .name { color: var(--fg); }
  .row .cl-active { color: var(--green); font-weight: 600; }
  .row .cl-name { color: var(--magenta); }
  .row .branch { color: var(--yellow); }
  .row .warn { color: var(--orange); }

  /* ── diff ───────────────────────────────────────────── */
  .diff { white-space: pre; font-size: 12.5px; }
  .diff .fh { color: var(--dim); }
  .diff .hh { color: var(--hunk); background: rgba(125,174,163,.08); display: block; }
  .diff .add { color: var(--add); }
  .diff .del { color: var(--del); }
  .diff .ctx { color: var(--fg); opacity: .75; }
  .diff .hunktag {
    float: right; color: var(--magenta); background: var(--bg);
    padding: 0 4px; font-size: 11px; border: 1px solid var(--border); border-radius: 3px;
  }
  .diff .hunktag.unassigned { color: var(--orange); }
  .diff .hunktag.dimtag { color: var(--dim); border-color: var(--border); opacity: .9; }
  .diff .hunkwrap { display: block; margin-bottom: 8px; }
  .diff .hunkwrap.foreign { opacity: .45; }
  .diff .hunk-sel { outline: 1px solid var(--border-focus); outline-offset: 1px; background: rgba(127,191,94,.06); }

  /* ── log panel (round 3, ADR 0007) ──────────────────── */
  .pbody:has(> .log) { overflow: hidden; display: flex; flex-direction: column; }
  .log { font-size: 12.5px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .log .lstream { overflow-y: auto; min-height: 0; flex: 1; }
  .log .lstream::-webkit-scrollbar { width: 0; }
  .log .lrow { white-space: pre-wrap; padding: 0 4px; }
  .log .g-info { color: var(--dim); }
  .log .t-info { color: var(--dim); }
  .log .t-cmd { color: var(--fg); opacity: .6; }
  .log .g-notice { color: var(--orange); }
  .log .t-notice { color: var(--fg); opacity: .85; }
  .log .g-error { color: var(--red); }
  .log .t-error { color: var(--red); opacity: .9; }
  /* pins — conditions that currently hold */
  .log .pinhold { flex: 0 0 auto; }
  .log .pinrow { white-space: pre-wrap; padding: 0 4px; color: var(--yellow); }
  .log .pinbanner { background: rgba(216,166,87,.10); margin: 0 0 3px; padding: 1px 0; }
  .log .pinbanner .pinrow { color: var(--yellow); }

  /* ── conflicts group (files panel) ──────────────────── */
  .row .conflict { color: var(--red); }
  .row .st-u { color: var(--red); }

  /* ── keybar ─────────────────────────────────────────── */
  .keybar {
    display: flex; gap: 16px; flex-wrap: wrap;
    padding: 4px 10px 8px;
    color: var(--dim); font-size: 12px;
  }
  .keybar b { color: var(--orange); font-weight: normal; }
  .keybar .spacer { flex: 1; }
  .keybar .brand { color: var(--dim); }

  /* ── modal (variant C move popup) ───────────────────── */
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .modal {
    background: var(--bg);
    border: 1px solid var(--border-focus);
    border-radius: 3px;
    padding: 14px 16px 10px;
    min-width: 340px;
    position: relative;
  }
  .modal .ptitle {
    position: absolute; top: -9px; left: 8px;
    background: var(--bg); padding: 0 5px; color: var(--border-focus);
  }

  /* ── layout helpers ─────────────────────────────────── */
  .cols { display: flex; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ── switcher bar ───────────────────────────────────── */
  #switcher {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: #e7dec6; color: #1b1d1e;
    border-radius: 999px; padding: 6px 14px;
    font-size: 12.5px; font-weight: 600;
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
    z-index: 50; user-select: none;
  }
  #switcher button {
    all: unset; cursor: pointer; padding: 0 6px; font-weight: 700;
  }
  #switcher button:hover { color: #a9440e; }
  #switcher .vlabel { min-width: 250px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>

<div id="switcher">
  <button id="prev" title="Previous variant (←)">◀</button>
  <span class="vlabel" id="vlabel"></span>
  <button id="next" title="Next variant (→)">▶</button>
</div>

<script>
/* ═══════════════ shared mock data ═══════════════ */
const S = {
  branch: 'feat/print-page-v2',
  changelists: [
    { id: 'cl1', name: 'print-page-v2 fixes', active: true,
      comment: 'viewport sizing + region buttons',
      files: [
        { path: 'src/components/PrintPage.astro', st: 'M', staged: true,  hunks: 3, stagedHunks: 3 },
        { path: 'src/styles/print.css',           st: 'M', staged: 'partial', hunks: 4, stagedHunks: 2 },
        { path: 'src/pages/print/[id].astro',     st: 'A', staged: false, hunks: 1, stagedHunks: 0 },
      ]},
    { id: 'cl2', name: 'subscription refactor', active: false,
      comment: 'session handling cleanup',
      files: [
        { path: 'src/lib/subscription/session.ts', st: 'M', staged: false, hunks: 5, stagedHunks: 0 },
        { path: 'src/lib/subscription/types.ts',   st: 'M', staged: false, hunks: 1, stagedHunks: 0 },
      ]},
    { id: 'cl3', name: 'formatting chores', active: false,
      comment: '',
      files: [
        { path: 'scripts/format-check.sh', st: 'A', staged: false, hunks: 1, stagedHunks: 0 },
      ]},
  ],
  unassigned: [
    { path: 'src/components/Nav.astro', st: 'M', staged: false, hunks: 2, stagedHunks: 0 },
    { path: 'README.md',                st: 'M', staged: false, hunks: 1, stagedHunks: 0 },
  ],
  commits: [
    { sha: '91a05c13', msg: "Merge branch 'feat/print-page-v2' into development" },
    { sha: '351c6cfc', msg: 'fix: across viewport size percentage sizing' },
    { sha: '8257d46a', msg: 'fix: size subscribe buttons correctly' },
    { sha: '6248746f', msg: 'fix: prevent spreads gallery overflowing' },
    { sha: '326f803b', msg: 'fix: revert print v2 region buttons' },
  ],
};

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function stSpan(st) {
  const cls = { M: 'st-m', A: 'st-a', D: 'st-d', R: 'st-r' }[st] || 'dim';
  return `<span class="${cls}">${st}</span>`;
}
function stagedMark(f) {
  if (f.staged === true) return `<span class="staged">●</span>`;
  if (f.staged === 'partial') return `<span class="staged">◐</span>`;
  return `<span class="dim">○</span>`;
}

const PRINT_CSS_HUNKS = [
  { header: '@@ -14,7 +14,7 @@ .print-region sizing', cl: 'print-page-v2 fixes', staged: true,
    lines: [
      ['ctx', '   .print-region {'],
      ['del', '-    width: 320px;'],
      ['add', '+    width: clamp(280px, 42vw, 360px);'],
      ['ctx', '     display: flex;'],
      ['ctx', '   }'],
    ]},
  { header: '@@ -41,6 +41,10 @@ toolbar touch targets', cl: 'print-page-v2 fixes', staged: false,
    lines: [
      ['ctx', '   .print-toolbar button {'],
      ['add', '+    min-height: 44px;'],
      ['add', '+  }'],
      ['add', '+'],
      ['add', '+  .print-toolbar select {'],
      ['ctx', '     font-size: 0.9rem;'],
      ['ctx', '   }'],
    ]},
  { header: '@@ -63,3 +67,8 @@ @media print rules', cl: 'unassigned', staged: false,
    lines: [
      ['ctx', '   .no-print { display: none; }'],
      ['add', '+  .print-region { break-inside: avoid; }'],
      ['add', '+  .print-toolbar { display: none; }'],
      ['ctx', ' }'],
    ]},
];

/* context = the drilled-in changelist name, or 'all'.
   Foreign hunks (owned by a different changelist) are dimmed with a dim tag. */
function renderDiff(hunks, { context = 'all', selected = null } = {}) {
  let out = `<span class="fh">--- a/src/styles/print.css\n+++ b/src/styles/print.css</span>\n`;
  hunks.forEach((h, i) => {
    const foreign = context !== 'all' && h.cl !== context;
    const showTag = context === 'all' || foreign;
    const tag = showTag
      ? `<span class="hunktag${h.cl === 'unassigned' ? ' unassigned' : ''}${foreign ? ' dimtag' : ''}">${esc(h.cl)}${h.cl === 'unassigned' ? '' : (h.staged ? ' ●' : ' ○')}</span>`
      : '';
    const lines = h.lines.map(([t, s]) => `<span class="${t}">${esc(s)}</span>`).join('\n');
    out += `<span class="hunkwrap${foreign ? ' foreign' : ''}${i === selected ? ' hunk-sel' : ''}"><span class="hh">${esc(h.header)} ${tag}</span>\n${lines}</span>`;
  });
  return out;
}

const DIFF_NAV = `<span class="fh">--- a/src/components/Nav.astro
+++ b/src/components/Nav.astro</span>
<span class="hh">@@ -8,7 +8,7 @@ const { currentPath } = Astro.props;</span>
<span class="ctx"> &lt;nav class="site-nav"&gt;</span>
<span class="del">-  &lt;a href="/" class="logo"&gt;Home&lt;/a&gt;</span>
<span class="add">+  &lt;a href="/" class="logo" aria-label="Home"&gt;Home&lt;/a&gt;</span>
<span class="ctx">   &lt;ul&gt;</span>
<span class="hh">@@ -22,6 +22,9 @@ const { currentPath } = Astro.props;</span>
<span class="ctx">   &lt;/ul&gt;</span>
<span class="add">+  &lt;button class="nav-toggle" aria-expanded="false"&gt;</span>
<span class="add">+    Menu</span>
<span class="add">+  &lt;/button&gt;</span>
<span class="ctx"> &lt;/nav&gt;</span>`;


function panel({ num, title, alt = '', count = '', focused = false, body, style = '' }) {
  return `<div class="panel${focused ? ' focused' : ''}" style="${style}">
    <span class="ptitle">${num !== undefined ? `<span class="pnum">[${num}]─</span>` : ''}${title}${alt ? ` <span class="alt">- ${alt}</span>` : ''}</span>
    ${count ? `<span class="pcount">${count}</span>` : ''}
    <div class="pbody">${body}</div>
  </div>`;
}

/* ═══════════════ Round 2 — variant A layout won. ═══════════════
   The switcher now cycles the three key STATES of that layout:
   A: drilled into a changelist   B: "all" meta-view   C: unassigned + move flow.
   Panel 2 order: all → changelists → unassigned. */

const KEYBAR = `<div class="keybar">
    <span><b>n</b> new changelist</span><span><b>d</b> delete</span><span><b>r</b> rename</span>
    <span><b>m</b> move to changelist</span><span><b>space</b> stage file</span><span><b>enter</b> hunks</span>
    <span><b>c</b> commit changelist</span><span><b>a</b> set active</span><span><b>?</b> keybindings</span>
    <span class="spacer"></span><span class="brand">gitchange 0.1.0-proto</span>
  </div>`;

/* contextual keybar while the diff panel is focused (hunk mode) */
const KEYBAR_HUNK = `<div class="keybar">
    <span><b>j/k</b> next/prev hunk</span><span><b>space</b> stage hunk</span>
    <span><b>enter</b> add all hunks to changelist</span><span><b>shift+enter</b> add hunk to changelist</span>
    <span><b>esc</b> back to files</span><span><b>?</b> keybindings</span>
    <span class="spacer"></span><span class="brand">gitchange 0.1.0-proto</span>
  </div>`;

function totalFiles() {
  return S.changelists.reduce((a, cl) => a + cl.files.length, 0) + S.unassigned.length;
}

function clPanelBody(sel) {
  const rows = [];
  rows.push({ key: 'all',
    html: `<span class="dim">≡</span> <span class="name">all</span> <span class="dim">(${totalFiles()})</span>` });
  S.changelists.forEach(cl => rows.push({ key: cl.id,
    html: `${cl.active ? '<span class="cl-active">*</span>' : ' '} <span class="cl-name">${esc(cl.name)}</span> <span class="dim">(${cl.files.length})</span>` }));
  rows.push({ key: 'unassigned',
    html: `<span class="warn">!</span> <span class="warn">unassigned</span> <span class="dim">(${S.unassigned.length})</span>` });
  return rows.map(r => `<div class="row${r.key === sel ? ' sel activebg' : ''}">${r.html}</div>`).join('');
}

function fileRow(f, selected) {
  return `<div class="row${selected ? ' sel' : ''}">${stagedMark(f)} ${stSpan(f.st)} <span class="name">${esc(f.path)}</span> <span class="dim">${f.stagedHunks}/${f.hunks}</span></div>`;
}

function layoutA({ clSel, clPos, filesAlt, filesBody, filesCount, filesFocused = true, diffFocused = false, diffAlt, diffBody, keybar = KEYBAR, overlay = '', log = undefined }) {
  if (log === undefined) { log = logPanel({ entries: LOG_REST }); }
  const statusBody = `<div class="row">✓ works-in-progress → <span class="branch">${S.branch}</span></div>`;
  const commitsBody = S.commits.map(c =>
    `<div class="row"><span class="branch">${c.sha}</span> <span class="dim">JD</span> ${esc(c.msg)}</div>`
  ).join('');
  return `<div class="cols" style="position: relative;">
    <div class="col" style="flex: 0 0 44%;">
      ${panel({ num: 1, title: 'Status', body: statusBody, style: 'flex: 0 0 auto;' })}
      ${panel({ num: 2, title: 'Changelists', count: clPos, focused: !filesFocused && !diffFocused, body: clPanelBody(clSel), style: 'flex: 0 0 auto;' })}
      ${panel({ num: 3, title: 'Files', alt: filesAlt, count: filesCount, focused: filesFocused, body: filesBody, style: 'flex: 1;' })}
      ${panel({ num: 4, title: 'Commits', count: '1 of 300', body: commitsBody, style: 'flex: 0 0 26%;' })}
    </div>
    <div class="col" style="flex: 1;">
      ${panel({ num: 0, title: 'Diff', alt: diffAlt, focused: diffFocused, body: `<div class="diff">${diffBody}</div>`, style: 'flex: 1;' })}
      ${log}
    </div>
    ${overlay}
  </div>${keybar}`;
}

/* ═══════════════ Round 3 — Log panel (ADR 0007, ticket #18) ═══════════════
   Three severities: · info (dim, incl. git-op echo) / ! notice / ✗ error.
   Pins = conditions that currently hold, always at top, self-clearing —
   rendered as a tinted banner block; the panel grows one row per pin so
   pins never eat history. ~20% of the right column at rest. */

const SEV_GLYPH = { info: '·', cmd: '·', notice: '!', error: '✗' };
function logRows(entries) {
  const rows = entries.map(([sev, txt]) => {
    const g = sev === 'cmd' ? 'info' : sev;
    return `<div class="lrow"><span class="g-${g}">${SEV_GLYPH[sev]}</span> <span class="t-${sev}">${esc(txt)}</span></div>`;
  }).join('');
  return `<div class="lstream">${rows}</div>`;
}
function pinRows(pins) {
  return pins.map(p => `<div class="pinrow">▲ ${esc(p)}</div>`).join('');
}
function logPanel({ pins = [], entries }) {
  const pinBlock = pins.length
    ? `<div class="pinhold"><div class="pinbanner">${pinRows(pins)}</div></div>`
    : '';
  const height = pins.length ? 20 + pins.length * 4 : 20;
  return panel({ num: 5, title: 'Log',
    body: `<div class="log">${pinBlock}${logRows(entries)}</div>`,
    style: `flex: 0 0 ${height}%;` });
}

const PINS_BUSY = [
  'rebase in progress — 2 conflicted',
  'watcher unavailable — polling',
];

const LOG_BUSY = [
  ['info',   'staged hunk — src/styles/print.css @@ -41,6'],
  ['cmd',    'git commit (temp index — print-page-v2 fixes, 4 hunks)'],
  ['error',  'commit failed — pre-commit hook exited 1'],
  ['cmd',    'git commit --no-verify (temp index — print-page-v2 fixes, 4 hunks)'],
  ['info',   'committed 3f2a91c "fix: viewport sizing"'],
  ['notice', 'watcher unavailable — falling back to 5s polling'],
  ['info',   'refresh — 14 files · 31 hunks'],
  ['notice', 'rebase detected — 2 files conflicted, commit disabled'],
  ['info',   'refresh — 14 files · 29 hunks (2 conflicted)'],
];

const LOG_REST = [
  ['info',   'refresh — 8 files · 19 hunks'],
  ['info',   'staged hunk — src/styles/print.css @@ -14,7'],
  ['info',   'staged file — src/components/PrintPage.astro'],
  ['cmd',    'git commit (temp index — print-page-v2 fixes, 6 hunks)'],
  ['info',   'committed 91a05c1 "fix: across viewport size percentage sizing"'],
  ['notice', 'auto-captured 1 hunk → print-page-v2 fixes (ambiguous overlap)'],
  ['info',   'refresh — 6 files · 14 hunks'],
];

/* files panel body for the busy state: conflicts group first (quarantined —
   no staged mark, files leave their changelist groups while unmerged) */
function busyFilesBody() {
  let body = '';
  body += `<div class="row"><span class="conflict">▾ conflicts</span> <span class="dim">(2)</span></div>`;
  body += `<div class="row sel">  <span class="st-u">U</span> <span class="name">src/lib/subscription/session.ts</span></div>`;
  body += `<div class="row">  <span class="st-u">U</span> <span class="name">src/styles/print.css</span></div>`;
  const group = (label, cls, files) => {
    body += `<div class="row"><span class="${cls}">▾ ${esc(label)}</span></div>`;
    files.forEach(f => {
      body += `<div class="row">  ${stagedMark(f)} ${stSpan(f.st)} <span class="name">${esc(f.path)}</span> <span class="dim">${f.stagedHunks}/${f.hunks}</span></div>`;
    });
  };
  group('print-page-v2 fixes *', 'cl-name', [S.changelists[0].files[0], S.changelists[0].files[2]]);
  group('subscription refactor', 'cl-name', [S.changelists[1].files[1]]);
  group('formatting chores', 'cl-name', S.changelists[2].files);
  group('unassigned', 'warn', S.unassigned);
  return body;
}

const DIFF_CONFLICTED = `<span class="fh">src/lib/subscription/session.ts</span>
<span style="color: var(--red); opacity: .85;">conflicted — resolve outside gitchange</span>`;

/* ── busy rebase state: pin banner + conflicts group + full severity mix ── */
function stateBusy() {
  return layoutA({
    clSel: 'all',
    clPos: '1 of 5',
    filesAlt: 'all changelists',
    filesCount: '1 of 8',
    filesBody: busyFilesBody(),
    diffAlt: 'session.ts (conflicted)',
    diffBody: DIFF_CONFLICTED,
    log: logPanel({ pins: PINS_BUSY, entries: LOG_BUSY }),
  });
}

/* ── Drilled into a changelist (2 → select → 3 → operate).
   Foreign hunks (owned by another changelist) render dimmed with a dim tag. ── */
function stateChangelist() {
  const cl = S.changelists[0];
  return layoutA({
    clSel: cl.id,
    clPos: '2 of 5',
    filesAlt: cl.name,
    filesCount: '2 of 3',
    filesBody: cl.files.map((f, i) => fileRow(f, i === 1)).join(''),
    diffAlt: 'print.css (2/4 staged · 1 hunk elsewhere)',
    diffBody: renderDiff(PRINT_CSS_HUNKS, { context: cl.name }),
  });
}

/* ── Diff panel focused: hunk mode (enter from Files) ── */
function stateHunkMode() {
  const cl = S.changelists[0];
  return layoutA({
    clSel: cl.id,
    clPos: '2 of 5',
    filesAlt: cl.name,
    filesCount: '2 of 3',
    filesFocused: false,
    diffFocused: true,
    filesBody: cl.files.map((f, i) => fileRow(f, i === 1)).join(''),
    diffAlt: 'print.css — hunk 2 of 3',
    diffBody: renderDiff(PRINT_CSS_HUNKS, { context: cl.name, selected: 1 }),
    keybar: KEYBAR_HUNK,
  });
}

/* ── "all" meta-view — launch default; files grouped by changelist, all hunks tagged ── */
function stateAll() {
  let body = '';
  const group = (label, cls, files, selPath) => {
    body += `<div class="row"><span class="${cls}">▾ ${esc(label)}</span></div>`;
    files.forEach(f => {
      body += `<div class="row${f.path === selPath ? ' sel' : ''}">  ${stagedMark(f)} ${stSpan(f.st)} <span class="name">${esc(f.path)}</span> <span class="dim">${f.stagedHunks}/${f.hunks}</span></div>`;
    });
  };
  S.changelists.forEach(cl => group(cl.name + (cl.active ? ' *' : ''), 'cl-name', cl.files, 'src/styles/print.css'));
  group('unassigned', 'warn', S.unassigned, null);
  return layoutA({
    clSel: 'all',
    clPos: '1 of 5',
    filesAlt: 'all changelists',
    filesCount: '3 of 8',
    filesFocused: false,
    filesBody: body,
    diffAlt: 'print.css — hunk tags show owning changelist',
    diffBody: renderDiff(PRINT_CSS_HUNKS, { context: 'all' }),
  });
}

/* ── State C: unassigned selected, move-to-changelist popup open ── */
function stateUnassigned() {
  const modal = `<div class="modal-overlay">
    <div class="modal">
      <span class="ptitle">Move to changelist</span>
      <div class="row dim" style="margin-bottom: 6px;">M src/components/Nav.astro</div>
      <div class="row">  <span class="cl-name">print-page-v2 fixes</span> <span class="dim">(active)</span></div>
      <div class="row sel">▸ <span class="cl-name">subscription refactor</span></div>
      <div class="row">  <span class="cl-name">formatting chores</span></div>
      <div class="row dim" style="margin-top: 8px;">──────────────────────────</div>
      <div class="row">  <span class="staged">+</span> create new changelist…</div>
      <div class="row dim" style="margin-top: 6px;"><b style="color: var(--orange); font-weight: normal;">enter</b> move · <b style="color: var(--orange); font-weight: normal;">esc</b> cancel</div>
    </div>
  </div>`;
  return layoutA({
    clSel: 'unassigned',
    clPos: '5 of 5',
    filesAlt: 'unassigned',
    filesCount: '1 of 2',
    filesBody: S.unassigned.map((f, i) => fileRow(f, i === 0)).join(''),
    diffAlt: 'src/components/Nav.astro (0/2 hunks staged)',
    diffBody: DIFF_NAV,
    overlay: modal,
  });
}

/* ═══════════════ switcher ═══════════════ */
const VARIANTS = [
  { key: 'A', name: 'Launch: "all" overview', render: stateAll },
  { key: 'B', name: 'Changelist drill-down', render: stateChangelist },
  { key: 'C', name: 'Hunk mode (diff focused)', render: stateHunkMode },
  { key: 'D', name: 'Unassigned + move flow', render: stateUnassigned },
  { key: 'E', name: 'Busy: rebase pins + conflicts', render: stateBusy },
];

function currentKey() {
  const k = new URLSearchParams(location.search).get('variant');
  return VARIANTS.some(v => v.key === k) ? k : 'A';
}
function render() {
  const v = VARIANTS.find(x => x.key === currentKey());
  document.getElementById('app').innerHTML = `<div class="variant-root">${v.render()}</div>`;
  document.getElementById('vlabel').textContent = `${v.key} — ${v.name}`;
  /* log streams sit scrolled to the newest entry, like a real TUI */
  document.querySelectorAll('.log .lstream').forEach(el => {
    el.scrollTop = el.scrollHeight;
  });
}
function cycle(dir) {
  const i = VARIANTS.findIndex(x => x.key === currentKey());
  const next = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length];
  const url = new URL(location.href);
  url.searchParams.set('variant', next.key);
  history.replaceState(null, '', url);
  render();
}
document.getElementById('prev').addEventListener('click', () => cycle(-1));
document.getElementById('next').addEventListener('click', () => cycle(1));
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
</body>
