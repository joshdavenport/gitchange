<!doctype html>
<!--
  PROTOTYPE — throwaway. Commit flow UI (wayfinder ticket 10), sibling of
  tui-prototype.html and following its conventions. Question: what does `c`
  show and do? Three STRUCTURAL variants of the commit dialog —
  A all-in-one modal, B/C two-step (review payload → message), D in-place
  commit mode — plus the four flow states ADR 0004 mandates:
  E ◑ staged-stale warn-and-confirm, F zero-staged stage-all offer,
  G drift re-confirm, H post-commit.
  ?variant=A..H cycles; ←/→ or the pill switcher.
  Toast/notice styling in G/H is provisional pending ticket 15
  (error/notification presentation vocabulary).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitchange — commit flow prototype</title>
<style>
  :root {
    --bg: #1b1d1e;
    --panel-bg: #1b1d1e;
    --fg: #d5c4a1;
    --dim: #665c54;
    --border: #504945;
    --border-focus: #7fbf5e;
    --title: #7daea3;
    --green: #a9b665;
    --yellow: #d8a657;
    --red: #ea6962;
    --blue: #7daea3;
    --magenta: #d3869b;
    --orange: #e78a4e;
    --sel-bg: #32302f;
    --active-bg: #2a3225;
    --add: #a9b665;
    --del: #ea6962;
    --hunk: #7daea3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.45;
    overflow: hidden;
  }
  #app { height: 100vh; display: flex; flex-direction: column; padding: 8px 6px 0; }
  .variant-root { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ── panels ─────────────────────────────────────────── */
  .panel {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 8px 6px;
    margin: 6px 4px 4px;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .panel.focused { border-color: var(--border-focus); }
  .panel > .ptitle {
    position: absolute;
    top: -9px; left: 8px;
    background: var(--bg);
    padding: 0 5px;
    color: var(--title);
    white-space: nowrap;
  }
  .panel.focused > .ptitle { color: var(--border-focus); }
  .panel > .ptitle .pnum { color: var(--dim); }
  .panel > .ptitle .alt { color: var(--dim); }
  .panel > .pcount {
    position: absolute;
    bottom: -1px; right: 10px;
    background: var(--bg);
    padding: 0 5px;
    color: var(--dim);
    font-size: 12px;
    line-height: 1;
  }
  .pbody { overflow-y: auto; flex: 1; min-height: 0; padding-top: 3px; }
  .pbody::-webkit-scrollbar { width: 0; }

  /* ── rows ───────────────────────────────────────────── */
  .row { white-space: pre; padding: 0 4px; cursor: default; }
  .row.sel { background: var(--sel-bg); }
  .row.activebg { background: var(--active-bg); }
  .row .st-m { color: var(--yellow); }
  .row .st-a { color: var(--green); }
  .row .st-d { color: var(--red); }
  .row .st-r { color: var(--blue); }
  .row .staged { color: var(--green); }
  .row .dim { color: var(--dim); }
  .row .name { color: var(--fg); }
  .row .cl-active { color: var(--green); font-weight: 600; }
  .row .cl-name { color: var(--magenta); }
  .row .branch { color: var(--yellow); }
  .row .warn { color: var(--orange); }
  .row .stale { color: var(--orange); }

  /* ── diff ───────────────────────────────────────────── */
  .diff { white-space: pre; font-size: 12.5px; }
  .diff .fh { color: var(--dim); }
  .diff .hh { color: var(--hunk); background: rgba(125,174,163,.08); display: block; }
  .diff .add { color: var(--add); }
  .diff .del { color: var(--del); }
  .diff .ctx { color: var(--fg); opacity: .75; }
  .diff .hunktag {
    float: right; color: var(--magenta); background: var(--bg);
    padding: 0 4px; font-size: 11px; border: 1px solid var(--border); border-radius: 3px;
  }
  .diff .hunktag.staletag { color: var(--orange); }
  .diff .hunkwrap { display: block; margin-bottom: 8px; }

  /* ── keybar ─────────────────────────────────────────── */
  .keybar {
    display: flex; gap: 16px; flex-wrap: wrap;
    padding: 4px 10px 8px;
    color: var(--dim); font-size: 12px;
  }
  .keybar b { color: var(--orange); font-weight: normal; }
  .keybar .spacer { flex: 1; }
  .keybar .brand { color: var(--dim); }

  /* ── modals ─────────────────────────────────────────── */
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .modal {
    background: var(--bg);
    border: 1px solid var(--border-focus);
    border-radius: 3px;
    padding: 14px 16px 10px;
    min-width: 340px;
    max-width: 640px;
    position: relative;
  }
  .modal .ptitle {
    position: absolute; top: -9px; left: 8px;
    background: var(--bg); padding: 0 5px; color: var(--border-focus);
  }
  .modal.dimmed { opacity: .4; }
  .modal.warnframe { border-color: var(--orange); }
  .modal.warnframe .ptitle { color: var(--orange); }
  .modal .mkeys { color: var(--dim); margin-top: 8px; }
  .modal .mkeys b { color: var(--orange); font-weight: normal; }
  .modal .sep { color: var(--dim); margin: 6px 0 4px; }

  /* fake text input */
  .msg-subject { color: var(--fg); }
  .msg-subject .cursor { background: var(--fg); color: var(--bg); }
  .msg-body { color: var(--dim); font-style: italic; }
  .msg-frame {
    border: 1px solid var(--border); border-radius: 3px;
    padding: 4px 6px; margin: 4px 0; white-space: pre;
  }
  .msg-frame.focus { border-color: var(--border-focus); }

  /* toast (provisional — ticket 15 owns the vocabulary) */
  .toast {
    position: absolute; top: 10px; right: 14px;
    border: 1px solid var(--green); border-radius: 3px;
    background: var(--bg); color: var(--green);
    padding: 3px 10px; font-size: 12px; z-index: 6;
  }

  /* ── layout helpers ─────────────────────────────────── */
  .cols { display: flex; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ── switcher bar ───────────────────────────────────── */
  #switcher {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: #e7dec6; color: #1b1d1e;
    border-radius: 999px; padding: 6px 14px;
    font-size: 12.5px; font-weight: 600;
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
    z-index: 50; user-select: none;
  }
  #switcher button {
    all: unset; cursor: pointer; padding: 0 6px; font-weight: 700;
  }
  #switcher button:hover { color: #a9440e; }
  #switcher .vlabel { min-width: 290px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>

<div id="switcher">
  <button id="prev" title="Previous variant (←)">◀</button>
  <span class="vlabel" id="vlabel"></span>
  <button id="next" title="Next variant (→)">▶</button>
</div>

<script>
/* ═══════════════ shared mock data (mirrors tui-prototype.html) ═══════════════
   Commit target: cl1 "print-page-v2 fixes".
   Payload = staged hunks (index content): PrintPage.astro 3/3 ●,
   print.css 2/4 (one of them ◑ staged-stale). [id].astro 0/1 — not in payload. */
const S = {
  branch: 'feat/print-page-v2',
  changelists: [
    { id: 'cl1', name: 'print-page-v2 fixes', active: true,
      files: [
        { path: 'src/components/PrintPage.astro', st: 'M', staged: true,  hunks: 3, stagedHunks: 3 },
        { path: 'src/styles/print.css',           st: 'M', staged: 'partial', hunks: 4, stagedHunks: 2, stale: 1 },
        { path: 'src/pages/print/[id].astro',     st: 'A', staged: false, hunks: 1, stagedHunks: 0 },
      ]},
    { id: 'cl2', name: 'subscription refactor', active: false,
      files: [
        { path: 'src/lib/subscription/session.ts', st: 'M', staged: false, hunks: 5, stagedHunks: 0 },
        { path: 'src/lib/subscription/types.ts',   st: 'M', staged: false, hunks: 1, stagedHunks: 0 },
      ]},
    { id: 'cl3', name: 'formatting chores', active: false,
      files: [
        { path: 'scripts/format-check.sh', st: 'A', staged: false, hunks: 1, stagedHunks: 0 },
      ]},
  ],
  unassigned: [
    { path: 'src/components/Nav.astro', st: 'M', staged: false, hunks: 2, stagedHunks: 0 },
    { path: 'README.md',                st: 'M', staged: false, hunks: 1, stagedHunks: 0 },
  ],
  commits: [
    { sha: '91a05c13', msg: "Merge branch 'feat/print-page-v2' into development" },
    { sha: '351c6cfc', msg: 'fix: across viewport size percentage sizing' },
    { sha: '8257d46a', msg: 'fix: size subscribe buttons correctly' },
    { sha: '6248746f', msg: 'fix: prevent spreads gallery overflowing' },
    { sha: '326f803b', msg: 'fix: revert print v2 region buttons' },
  ],
};

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function stSpan(st) {
  const cls = { M: 'st-m', A: 'st-a', D: 'st-d', R: 'st-r' }[st] || 'dim';
  return `<span class="${cls}">${st}</span>`;
}
function stagedMark(f) {
  if (f.staged === true) return `<span class="staged">●</span>`;
  if (f.staged === 'partial') return `<span class="staged">◐</span>`;
  return `<span class="dim">○</span>`;
}

/* payload hunks as committed (index content) — for the in-place preview (D) */
const PAYLOAD_HUNKS = [
  { file: 'src/components/PrintPage.astro', header: '@@ -12,6 +12,9 @@ region buttons', stale: false,
    lines: [
      ['ctx', '   const regions = getRegions(page);'],
      ['add', '+  const buttons = regions.map(regionButton);'],
      ['add', '+'],
      ['ctx', '   ---'],
    ]},
  { file: 'src/components/PrintPage.astro', header: '@@ -40,7 +43,7 @@ viewport sizing', stale: false,
    lines: [
      ['ctx', '   <div class="print-viewport"'],
      ['del', '-    style="width: 900px">'],
      ['add', '+    style={`width: ${viewportWidth}px`}>'],
      ['ctx', '   </div>'],
    ]},
  { file: 'src/components/PrintPage.astro', header: '@@ -71,4 +74,5 @@ export cleanup', stale: false,
    lines: [
      ['ctx', '   </Layout>'],
      ['add', '+  <!-- print-only footer -->'],
    ]},
  { file: 'src/styles/print.css', header: '@@ -14,7 +14,7 @@ .print-region sizing', stale: false,
    lines: [
      ['ctx', '   .print-region {'],
      ['del', '-    width: 320px;'],
      ['add', '+    width: clamp(280px, 42vw, 360px);'],
      ['ctx', '   }'],
    ]},
  { file: 'src/styles/print.css', header: '@@ -41,6 +41,10 @@ toolbar touch targets', stale: true,
    lines: [
      ['ctx', '   .print-toolbar button {'],
      ['add', '+    min-height: 44px;'],
      ['add', '+  }'],
      ['add', '+'],
      ['add', '+  .print-toolbar select {'],
      ['ctx', '     font-size: 0.9rem;'],
    ]},
];

function renderPayloadDiff() {
  let out = '';
  let lastFile = null;
  PAYLOAD_HUNKS.forEach(h => {
    if (h.file !== lastFile) {
      out += `<span class="fh">--- a/${esc(h.file)}\n+++ b/${esc(h.file)}</span>\n`;
      lastFile = h.file;
    }
    const tag = h.stale
      ? `<span class="hunktag staletag">◑ staged-stale — index ≠ worktree</span>` : '';
    const lines = h.lines.map(([t, s]) => `<span class="${t}">${esc(s)}</span>`).join('\n');
    out += `<span class="hunkwrap"><span class="hh">${esc(h.header)} ${tag}</span>\n${lines}</span>`;
  });
  return out;
}

function panel({ num, title, alt = '', count = '', focused = false, body, style = '' }) {
  return `<div class="panel${focused ? ' focused' : ''}" style="${style}">
    <span class="ptitle">${num !== undefined ? `<span class="pnum">[${num}]─</span>` : ''}${title}${alt ? ` <span class="alt">- ${alt}</span>` : ''}</span>
    ${count ? `<span class="pcount">${count}</span>` : ''}
    <div class="pbody">${body}</div>
  </div>`;
}

const KEYBAR = `<div class="keybar">
    <span><b>n</b> new changelist</span><span><b>d</b> delete</span><span><b>r</b> rename</span>
    <span><b>m</b> move to changelist</span><span><b>space</b> stage file</span><span><b>enter</b> hunks</span>
    <span><b>c</b> commit changelist</span><span><b>a</b> set active</span><span><b>?</b> keybindings</span>
    <span class="spacer"></span><span class="brand">gitchange 0.1.0-proto</span>
  </div>`;

/* contextual keybar while in-place commit mode is active (variant D) */
const KEYBAR_COMMIT = `<div class="keybar">
    <span><b>enter</b> commit</span><span><b>tab</b> edit body</span>
    <span><b>ctrl+n</b> toggle --no-verify</span><span><b>ctrl+a</b> toggle --amend</span>
    <span><b>j/k</b> scroll preview</span><span><b>esc</b> cancel commit</span>
    <span class="spacer"></span><span class="brand">gitchange 0.1.0-proto</span>
  </div>`;

function totalFiles() {
  return S.changelists.reduce((a, cl) => a + cl.files.length, 0) + S.unassigned.length;
}

function clPanelBody(sel, lists = S.changelists, unassigned = S.unassigned) {
  const rows = [];
  rows.push({ key: 'all',
    html: `<span class="dim">≡</span> <span class="name">all</span> <span class="dim">(${lists.reduce((a, c) => a + c.files.length, 0) + unassigned.length})</span>` });
  lists.forEach(cl => rows.push({ key: cl.id,
    html: `${cl.active ? '<span class="cl-active">*</span>' : ' '} <span class="cl-name">${esc(cl.name)}</span> <span class="dim">(${cl.files.length})</span>` }));
  rows.push({ key: 'unassigned',
    html: `<span class="warn">!</span> <span class="warn">unassigned</span> <span class="dim">(${unassigned.length})</span>` });
  return rows.map(r => `<div class="row${r.key === sel ? ' sel activebg' : ''}">${r.html}</div>`).join('');
}

function fileRow(f, selected) {
  return `<div class="row${selected ? ' sel' : ''}">${stagedMark(f)} ${stSpan(f.st)} <span class="name">${esc(f.path)}</span> <span class="dim">${f.stagedHunks}/${f.hunks}</span></div>`;
}

function layoutA({ clSel, clPos, filesAlt, filesBody, filesCount, filesFocused = true, diffFocused = false, diffAlt, diffBody, keybar = KEYBAR, overlay = '', commits = S.commits, lists = S.changelists, unassigned = S.unassigned, toast = '' }) {
  const statusBody = `<div class="row">✓ works-in-progress → <span class="branch">${S.branch}</span></div>`;
  const commitsBody = commits.map(c =>
    `<div class="row">${c.fresh ? `<span class="staged">${c.sha}</span>` : `<span class="branch">${c.sha}</span>`} <span class="dim">JD</span> ${esc(c.msg)}</div>`
  ).join('');
  return `<div class="cols" style="position: relative;">
    <div class="col" style="flex: 0 0 44%;">
      ${panel({ num: 1, title: 'Status', body: statusBody, style: 'flex: 0 0 auto;' })}
      ${panel({ num: 2, title: 'Changelists', count: clPos, focused: !filesFocused && !diffFocused, body: clPanelBody(clSel, lists, unassigned), style: 'flex: 0 0 auto;' })}
      ${panel({ num: 3, title: 'Files', alt: filesAlt, count: filesCount, focused: filesFocused, body: filesBody, style: 'flex: 1;' })}
      ${panel({ num: 4, title: 'Commits', count: '1 of 300', body: commitsBody, style: 'flex: 0 0 26%;' })}
    </div>
    <div class="col" style="flex: 1;">
      ${panel({ num: 0, title: 'Diff', alt: diffAlt, focused: diffFocused, body: `<div class="diff">${diffBody}</div>`, style: 'flex: 1;' })}
      ${toast}
    </div>
    ${overlay}
  </div>${keybar}`;
}

/* base scene behind every commit popup: drilled into cl1, files focused */
function baseScene(overlay, keybar = KEYBAR) {
  const cl = S.changelists[0];
  return layoutA({
    clSel: cl.id,
    clPos: '2 of 5',
    filesAlt: cl.name,
    filesCount: '1 of 3',
    filesBody: cl.files.map((f, i) => fileRow(f, i === 0)).join(''),
    diffAlt: 'PrintPage.astro (3/3 staged)',
    diffBody: renderPayloadDiff(),
    overlay, keybar,
  });
}

/* ── payload summary rows (shared by A and B) ── */
function payloadSummaryRows({ hunkDetail = false, showExcluded = false } = {}) {
  const cl = S.changelists[0];
  let rows = '';
  cl.files.forEach(f => {
    const inPayload = f.stagedHunks > 0;
    if (!inPayload && !showExcluded) return;
    const staleNote = f.stale ? ` <span class="stale">· ${f.stale} ◑</span>` : '';
    if (inPayload) {
      rows += `<div class="row">${stagedMark(f)} ${stSpan(f.st)} <span class="name">${esc(f.path)}</span> <span class="dim">${f.stagedHunks}/${f.hunks} staged</span>${staleNote}</div>`;
    } else {
      rows += `<div class="row dim">○ ${esc(f.st)} ${esc(f.path)} ${f.stagedHunks}/${f.hunks} — not in payload</div>`;
    }
    if (hunkDetail && inPayload) {
      PAYLOAD_HUNKS.filter(h => h.file === f.path).forEach(h => {
        rows += `<div class="row">    <span class="${h.stale ? 'stale' : 'dim'}">${h.stale ? '◑' : '●'}</span> <span class="dim">${esc(h.header)}</span></div>`;
      });
    }
  });
  return rows;
}

const MSG_SUBJECT = 'fix: viewport sizing + region buttons';

/* ═══ A — all-in-one modal: payload summary + message in one popup ═══ */
function stateAllInOne() {
  const modal = `<div class="modal-overlay">
    <div class="modal" style="min-width: 560px;">
      <span class="ptitle">Commit changelist — <span style="color: var(--magenta);">print-page-v2 fixes</span></span>
      <div class="row dim" style="margin-bottom: 4px;">payload: 5 staged hunks in 2 files <span class="stale">· 1 ◑</span></div>
      ${payloadSummaryRows({ showExcluded: true })}
      <div class="sep">── message ──────────────────────────────────────────</div>
      <div class="msg-frame focus"><span class="msg-subject">${esc(MSG_SUBJECT)}<span class="cursor">▍</span></span>
<span class="msg-body">…body (tab)</span></div>
      <div class="row dim">[ ] --no-verify   [ ] --amend</div>
      <div class="mkeys"><b>enter</b> commit · <b>tab</b> body · <b>ctrl+n</b> no-verify · <b>ctrl+a</b> amend · <b>esc</b> cancel</div>
    </div>
  </div>`;
  return baseScene(modal);
}

/* ═══ B — two-step, step 1: review payload (hunk-level, read-only) ═══ */
function stateReview() {
  const modal = `<div class="modal-overlay">
    <div class="modal" style="min-width: 560px;">
      <span class="ptitle">Commit 1/2 — review payload</span>
      <div class="row dim" style="margin-bottom: 4px;"><span class="cl-name">print-page-v2 fixes</span> — 5 staged hunks in 2 files <span class="stale">· 1 ◑</span></div>
      ${payloadSummaryRows({ hunkDetail: true })}
      <div class="row dim" style="margin-top: 6px;">unstaged hunks stay in the worktree; stage with <b style="color: var(--orange); font-weight: normal;">space</b> before committing</div>
      <div class="row dim">[ ] --no-verify   [ ] --amend</div>
      <div class="mkeys"><b>enter</b> continue to message · <b>ctrl+n</b> no-verify · <b>ctrl+a</b> amend · <b>esc</b> cancel</div>
    </div>
  </div>`;
  return baseScene(modal);
}

/* ═══ C — two-step, step 2: message only (lazygit-style) ═══ */
function stateMessage() {
  const modal = `<div class="modal-overlay">
    <div class="modal" style="min-width: 480px;">
      <span class="ptitle">Commit 2/2 — message</span>
      <div class="row dim" style="margin-bottom: 4px;"><span class="cl-name">print-page-v2 fixes</span> — 5 hunks, 2 files <span class="stale">· 1 ◑</span></div>
      <div class="msg-frame focus"><span class="msg-subject">${esc(MSG_SUBJECT)}<span class="cursor">▍</span></span>
<span class="msg-body">…body (tab)</span></div>
      <div class="mkeys"><b>enter</b> commit · <b>tab</b> body · <b>esc</b> back to review</div>
    </div>
  </div>`;
  return baseScene(modal);
}

/* ═══ D — in-place commit mode: no popup; diff panel becomes the payload
   preview, files panel filters to payload files, contextual keybar ═══ */
function stateInPlace() {
  const cl = S.changelists[0];
  const payloadFiles = cl.files.filter(f => f.stagedHunks > 0);
  const msgBlock = `<div class="msg-frame focus" style="margin: 0 0 8px;"><span class="dim">message: </span><span class="msg-subject">${esc(MSG_SUBJECT)}<span class="cursor">▍</span></span>
<span class="msg-body">…body (tab)</span></div>`;
  return layoutA({
    clSel: cl.id,
    clPos: '2 of 5',
    filesAlt: `commit: ${cl.name}`,
    filesCount: '2 files',
    filesFocused: false,
    diffFocused: true,
    filesBody: payloadFiles.map(f => fileRow(f, false)).join('')
      + `<div class="row dim" style="margin-top: 6px;">1 unstaged file not in payload</div>`,
    diffAlt: 'commit preview — 5 hunks · 1 ◑',
    diffBody: msgBlock + renderPayloadDiff(),
    keybar: KEYBAR_COMMIT,
  });
}

/* ═══ E — ◑ staged-stale warn-and-confirm (ADR 0004), layered over A ═══ */
function stateStaleWarn() {
  const base = `<div class="modal dimmed" style="min-width: 560px; transform: translate(-24px, -36px);">
      <span class="ptitle">Commit changelist — print-page-v2 fixes</span>
      <div class="row dim">payload: 5 staged hunks in 2 files · 1 ◑</div>
      ${payloadSummaryRows({ showExcluded: true })}
    </div>`;
  const warn = `<div class="modal warnframe" style="min-width: 480px; z-index: 7; position: absolute; left: 50%; top: 50%; transform: translate(-46%, -38%);">
      <span class="ptitle">◑ staged-stale hunks in payload</span>
      <div class="row">1 of 5 payload hunks is <span class="stale">◑</span> — the index holds a</div>
      <div class="row">different version than the worktree. Committing as-is</div>
      <div class="row">commits content that isn't what you see.</div>
      <div class="row" style="margin-top: 6px;"><span class="stale">◑</span> <span class="name">src/styles/print.css</span> <span class="dim">@@ -41,6 +41,10 @@ toolbar touch targets</span></div>
      <div class="mkeys"><b>enter</b> commit as-is · <b>w</b> align index to worktree &amp; commit · <b>esc</b> back</div>
    </div>`;
  const overlay = `<div class="modal-overlay">${base}${warn}</div>`;
  return baseScene(overlay);
}

/* ═══ F — zero staged: stage-all-and-commit offer (ADR 0004) ═══ */
function stateStageAllOffer() {
  const cl = S.changelists[1]; /* subscription refactor — nothing staged */
  const modal = `<div class="modal-overlay">
    <div class="modal" style="min-width: 460px;">
      <span class="ptitle">Nothing staged</span>
      <div class="row"><span class="cl-name">subscription refactor</span> has no staged hunks.</div>
      <div class="row">Stage all <span class="name">6 hunks in 2 files</span> and commit?</div>
      <div class="mkeys"><b>enter</b> stage all &amp; continue · <b>esc</b> cancel</div>
    </div>
  </div>`;
  return layoutA({
    clSel: cl.id,
    clPos: '3 of 5',
    filesAlt: cl.name,
    filesCount: '1 of 2',
    filesBody: cl.files.map((f, i) => fileRow(f, i === 0)).join(''),
    diffAlt: 'session.ts (0/5 staged)',
    diffBody: `<span class="fh">--- a/src/lib/subscription/session.ts\n+++ b/src/lib/subscription/session.ts</span>\n<span class="hh">@@ -18,9 +18,7 @@ session bootstrap</span>\n<span class="ctx">   const session = await getSession(ctx);</span>\n<span class="del">-  if (!session) {</span>\n<span class="del">-    return null;</span>\n<span class="del">-  }</span>\n<span class="add">+  if (!session) return null;</span>`,
    overlay: modal,
  });
}

/* ═══ G — drift re-confirm: sync refresh at confirm changed the payload
   (ADR 0004 freshness guard). Notice styling provisional — ticket 15. ═══ */
function stateDriftReconfirm() {
  const modal = `<div class="modal-overlay">
    <div class="modal warnframe" style="min-width: 560px;">
      <span class="ptitle">Payload changed — re-confirm</span>
      <div class="row">The working tree changed while you were writing the message.</div>
      <div class="row dim" style="margin: 4px 0;">was: 5 hunks in 2 files → now: <span class="name" style="color: var(--fg);">4 hunks in 2 files</span></div>
      <div class="row"><span class="del" style="color: var(--red);">−</span> <span class="name">src/styles/print.css</span> <span class="dim">@@ -41,6 +41,10 @@ — edited in worktree, now ◑ unstaged</span></div>
      <div class="sep">── message (kept) ───────────────────────────────────</div>
      <div class="msg-frame"><span class="msg-subject">${esc(MSG_SUBJECT)}</span></div>
      <div class="mkeys"><b>enter</b> commit updated payload · <b>e</b> edit message · <b>esc</b> cancel</div>
    </div>
  </div>`;
  return baseScene(modal);
}

/* ═══ H — post-commit: HEAD moved, consumed records gone, changelist kept.
   PrintPage.astro fully consumed → leaves the list. print.css ◑ committed
   as-is → residual worktree diff re-attaches (ADR 0001 overlap tier).
   Toast is provisional — ticket 15 owns notification vocabulary. ═══ */
function statePostCommit() {
  const committedLists = [
    { id: 'cl1', name: 'print-page-v2 fixes', active: true,
      files: [
        { path: 'src/styles/print.css',       st: 'M', staged: false, hunks: 3, stagedHunks: 0 },
        { path: 'src/pages/print/[id].astro', st: 'A', staged: false, hunks: 1, stagedHunks: 0 },
      ]},
    S.changelists[1],
    S.changelists[2],
  ];
  const commits = [
    { sha: 'a1b2c3d4', msg: 'fix: viewport sizing + region buttons', fresh: true },
    ...S.commits,
  ];
  const cl = committedLists[0];
  const toast = `<div class="toast">✓ committed print-page-v2 fixes → a1b2c3d4 (5 hunks, 2 files)</div>`;
  return layoutA({
    clSel: cl.id,
    clPos: '2 of 5',
    filesAlt: cl.name,
    filesCount: '1 of 2',
    filesBody: cl.files.map((f, i) => fileRow(f, i === 0)).join(''),
    diffAlt: 'print.css (0/3 staged · residual from ◑ commit re-attached)',
    diffBody: `<span class="fh">--- a/src/styles/print.css\n+++ b/src/styles/print.css</span>\n<span class="hh">@@ -41,8 +41,9 @@ toolbar touch targets</span>\n<span class="ctx">   .print-toolbar button {</span>\n<span class="ctx">     min-height: 44px;</span>\n<span class="ctx">   }</span>\n<span class="add">+  /* worktree edit made after staging — residual diff */</span>\n<span class="ctx">   .print-toolbar select {</span>`,
    lists: committedLists,
    commits,
    toast,
  });
}

/* ═══════════════ switcher ═══════════════ */
const VARIANTS = [
  { key: 'A', name: 'Commit — all-in-one modal', render: stateAllInOne },
  { key: 'B', name: 'Commit — two-step: 1 review payload', render: stateReview },
  { key: 'C', name: 'Commit — two-step: 2 message', render: stateMessage },
  { key: 'D', name: 'Commit — in-place commit mode', render: stateInPlace },
  { key: 'E', name: '◑ staged-stale warn-and-confirm', render: stateStaleWarn },
  { key: 'F', name: 'Zero staged — stage-all offer', render: stateStageAllOffer },
  { key: 'G', name: 'Drift re-confirm notice', render: stateDriftReconfirm },
  { key: 'H', name: 'Post-commit state', render: statePostCommit },
];

function currentKey() {
  const k = new URLSearchParams(location.search).get('variant');
  return VARIANTS.some(v => v.key === k) ? k : 'A';
}
function render() {
  const v = VARIANTS.find(x => x.key === currentKey());
  document.getElementById('app').innerHTML = `<div class="variant-root">${v.render()}</div>`;
  document.getElementById('vlabel').textContent = `${v.key} — ${v.name}`;
}
function cycle(dir) {
  const i = VARIANTS.findIndex(x => x.key === currentKey());
  const next = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length];
  const url = new URL(location.href);
  url.searchParams.set('variant', next.key);
  history.replaceState(null, '', url);
  render();
}
document.getElementById('prev').addEventListener('click', () => cycle(-1));
document.getElementById('next').addEventListener('click', () => cycle(1));
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
