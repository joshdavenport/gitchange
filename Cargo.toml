[workspace]
resolver = "3"
members = [
  "crates/gitchange-core",
  "crates/gitchange-test-support",
  "crates/gitchange-tui",
  "crates/gitchange",
  "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/joshdavenport/gitchange"

[workspace.dependencies]
gitchange-core = { path = "crates/gitchange-core" }
gitchange-test-support = { path = "crates/gitchange-test-support" }
gitchange-tui = { path = "crates/gitchange-tui" }
# Shared so core and the fixture crate can never build repository states
# through a different libgit2 than the code under test (ADR 0006/0008).
git2 = { version = "0.20", default-features = false }
thiserror = "2"
crossbeam-channel = "0.5"
ratatui = "0.29"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
